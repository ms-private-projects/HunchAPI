api_version: "3.0.0"
name: hunch-api
resources:
# The key is also the Agent's MCP tool prefix (`hunch__list_tools`, `hunch__call_tool`), so it must
# match ^[a-z][a-z0-9_]{0,39}$. The Hunch site names this release by this key.
- key: hunch
  kind: fastapi
  # The API's own workload User. Every MetaTable is read through the MetaTables API on the
  # MetaTables repository's branch; `user` on the Agent lets the project configuration find and
  # return it to the site (site_agent.py). Roles on the `mainsequence.markets` namespace
  # (data_viewer / data_writer) are granted by the namespace owner, not declared here.
  access:
    branch: editor
    branches:
    - repository: MetaTables
      policy: reader
    resources:
    - key: hunch-agent
      policy: user
    - key: hunch-take-build
      policy: runner
    - key: hunch-daily-review
      policy: runner
    - key: hunch-portfolio-refresh
      policy: runner
    - key: hunch-portfolio-refresh-dispatcher
      policy: viewer
  spec:
    source_path: api/app/main.py
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
    mcp_enabled: true
    cors_allowed_origins:
    - https://*.site-dev.main-sequence.app
    env_vars:
    - name: HUNCH_CORS_ORIGINS
      value: https://*.site-dev.main-sequence.app
    # Hosted, the API starts builds and refreshes as the Jobs below, never in its own process.
    - name: HUNCH_BUILD_EXECUTION
      value: job
    # Venue connectors: `live` calls the Alpaca and IBKR connector releases over HTTP at these
    # URLs (set them to the releases' base URLs before the first push); `simulated` keeps a
    # paper venue inside Hunch and is for local development only. Calling another repository's
    # release also needs `access.branches: [{repository: <connector repository>, policy: user}]`
    # on this API and on the hunch-daily-review and hunch-execution-sync Jobs (plan §3.3); add
    # them when the connector releases exist, with HUNCH_<VENUE>_CONNECTOR_RELEASE_UID if the
    # gateway routes by release UID.
    - name: HUNCH_CONNECTOR_MODE
      value: live
    - name: HUNCH_ALPACA_CONNECTOR_URL
      value: ''
    - name: HUNCH_IBKR_CONNECTOR_URL
      value: ''
# The branch's one Harness Agent: the Hunch Agent. It reaches every project tool through the
# `hunch` API's MCP and acts for the person whose request it serves (only an Organization admin's
# push enables this). It reads no tables itself and never calls a venue connector.
- key: hunch-agent
  kind: harness_agent
  acts_for_requester: true
  access:
    resources:
    - key: hunch
      policy: user
  spec:
    source_path: api/agent/main.py
    # Provider, model and thinking level are the deployment's choice; adjust before the first push.
    llm_provider: openai-codex
    llm_model: gpt-5.6-luna
    llm_thinking: medium
    mcp_applications:
    - resource: hunch
    # Only Hunch application tools; TAU retains skill-scoped reading and A2A Task controls.
    env_vars:
    - name: TAU_EXCLUDE_BASE_TOOLS
      value: 'true'
    - name: TAU_EXCLUDE_MAINSEQUENCE_MCP
      value: 'true'
    cpu_request: 250m
    memory_request: 512Mi
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
- key: hunch-migrate
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Hunch Migrations
    description: Apply the hunch MetaTable schema revisions before the API rolls out.
    execution_path: src/jobs/migrate_hunch.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    automatic_redeployment:
      enabled: true
      tag_regex: null
# Builds and refreshes run as one shared Job per kind, selected by `--take-uid` (the API, the
# Agent through the API, and the dispatcher start them). A Job cannot hold `runner` on itself, so
# the dispatcher below starts the scheduled refreshes after the market close.
- key: hunch-take-build
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    model_providers:
    # Research runs through recorded inference with this credential; adjust before the first push.
    - provider: openai-codex
      policy: user
  spec:
    name: Hunch Take Build
    description: Research one take, apply its constraints, publish its basket and build its portfolio (--take-uid).
    execution_path: src/jobs/run_hunch_take_build.py
    cpu_request: '0.5'
    memory_request: '1'
    max_runtime_seconds: 1800
    spot: false
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: hunch-portfolio-refresh
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Hunch Portfolio Refresh
    description: Bring prices up to date and extend the values of one take (--take-uid) or of every built take (--scheduled).
    execution_path: src/jobs/run_hunch_portfolio_refresh.py
    cpu_request: '0.5'
    memory_request: '1'
    max_runtime_seconds: 3600
    spot: false
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: hunch-portfolio-refresh-dispatcher
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    resources:
    - key: hunch-portfolio-refresh
      policy: runner
  spec:
    name: Hunch Portfolio Refresh Dispatcher
    description: Start the scheduled refresh of every built take after the US market close.
    execution_path: src/jobs/run_hunch_portfolio_refresh.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '30 1 * * 2-6'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: hunch-daily-review
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    model_providers:
    - provider: openai-codex
      policy: user
  spec:
    name: Hunch Daily Review
    description: 'Review one active take (--take-uid) or every active take (--scheduled): drift, thesis check, proposal or autopilot.'
    execution_path: src/jobs/run_hunch_daily_review.py
    cpu_request: '0.5'
    memory_request: '1'
    max_runtime_seconds: 3600
    spot: false
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: hunch-daily-review-dispatcher
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    resources:
    - key: hunch-daily-review
      policy: runner
  spec:
    name: Hunch Daily Review Dispatcher
    description: Start the scheduled review of every active take before the US open on session days.
    execution_path: src/jobs/run_hunch_daily_review.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '0 13 * * 1-5'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: hunch-execution-sync
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Hunch Execution Sync
    description: Pull order states from the venue connectors, book fills into the takes' funds and expire stale proposals.
    execution_path: src/jobs/run_hunch_execution_sync.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '*/15 13-21 * * 1-5'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: hunch-leaderboard
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Hunch Leaderboard
    description: Snapshot the ranking of published takes after the refresh.
    execution_path: src/jobs/run_hunch_leaderboard.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '30 2 * * 2-6'
        timezone: UTC
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: hunch-email-digest
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Hunch Email Digest
    description: 'Email every opted-in person a digest of their undelivered notifications and pending proposals (--scheduled), after the daily reviews.'
    execution_path: src/jobs/run_hunch_email_digest.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    env_vars:
    # `platform` delivers through a Main Sequence Notification with include_email; `outbox` and
    # `smtp` are the local and self-hosted alternatives (see hunch/channels/email.py).
    - name: HUNCH_EMAIL_SENDER
      value: platform
    - name: HUNCH_SITE_URL
      value: ''
    task_schedule:
      schedule:
        type: crontab
        expression: '30 13 * * 1-5'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
# The migration Job runs from the API's candidate image. The API deploys only after it succeeds,
# and the Agent deploys from its own image only after the API whose MCP it uses.
execution:
  steps:
    image:
      prepare_image: hunch
    migrate:
      run_job: hunch-migrate
      image_from: image
      needs: [image]
    deploy_api:
      deploy: hunch
      image_from: image
      needs: [migrate]
    agent_image:
      prepare_image: hunch-agent
    deploy_agent:
      deploy: hunch-agent
      image_from: agent_image
      needs: [deploy_api, agent_image]
