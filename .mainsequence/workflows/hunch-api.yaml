api_version: "3.0.0"
name: hunch-api
# Deploys come only from release tags: every resource below carries the same `tag_regex`, so a push
# builds and deploys nothing until a tag such as `v0.2.0` points at a commit of the branch (a tag on
# an older commit deploys that commit). Keep the rule identical on every resource: resources that
# depend on each other deploy as one group, and one member without a matching tag skips the group.
resources:
# The key is also the Agent's MCP tool prefix (`hunch__list_tools`, `hunch__call_tool`), so it must
# match ^[a-z][a-z0-9_]{0,39}$. The Hunch site names this release by this key.
- key: hunch
  kind: fastapi
  # The API's own workload User. Hunch's own tables are read through the MetaTables API on the
  # MetaTables repository's branch; every Markets registry (assets, calendars, accounts,
  # portfolios, signals, funds) through the Markets API, which `reader` on the MainSequenceMarkets
  # branch lets the workload discover (ADR 0006; every Job that starts the Markets engine carries
  # the same grant). `user` on the Agent lets the project configuration find and return it to the
  # site (site_agent.py). MetaTables roles (`editor` for hunch-migrate, `data_writer` for the API
  # and the other Jobs, all on the `hunch` namespace only, plus `editor` on the series tables for
  # the workloads that run updaters) are granted by the namespace owners, not declared here:
  # docs/operations/hosted-deploy.md, "MetaTables roles".
  access:
    branch: editor
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    resources:
    - key: hunch-agent
      policy: user
    - key: hunch-take-research
      policy: runner
    - key: hunch-take-build
      policy: runner
    - key: hunch-daily-review
      policy: runner
    - key: hunch-portfolio-refresh
      policy: runner
    - key: hunch-portfolio-refresh-dispatcher
      policy: viewer
    # The analysis role's recorded model calls (the thesis critique) run in this API as its own
    # workload, on the Environment's Meta credential (custom_id `meta`). Declared 2026-11-01 for
    # development with the owner's approval, replacing a short-lived OpenRouter share: every later
    # push keeps the share and usage is billed to the credential's owner (ADR 0007).
    model_providers:
    - provider: meta
      custom_id: meta
      policy: user
  spec:
    source_path: api/app/main.py
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
    revision_retention_count: 3
    mcp_enabled: true
    cors_allowed_origins:
    - https://*.site-dev.main-sequence.app
    env_vars:
    - name: HUNCH_CORS_ORIGINS
      value: https://*.site-dev.main-sequence.app
    # Hosted, the API starts builds and refreshes as the Jobs below, never in its own process.
    - name: HUNCH_BUILD_EXECUTION
      value: job
    # Venue connectors: `live` calls the Alpaca and IBKR connector releases by their ResourceRelease
    # UID (the platform grants this workload an RPC URL and token through resolve-runtime-access);
    # `simulated` keeps a paper venue inside Hunch and is for local development only. Neither
    # connector API is deployed yet (2026-10-25): set each UID from
    # `GET /api/v1/resource-releases/?name=<key>&release_kind=fastapi&organization_environment_uid=<env>`
    # once the connector workflow is pushed to this Environment's branch, and give this API and the
    # hunch-daily-review and hunch-execution-sync Jobs `access.branches:
    # [{repository: alpaca-connectors, policy: reader}]` (branch `reader` makes the workload a
    # release `viewer`, which may call it). An empty UID leaves the venue disabled in the site.
    - name: HUNCH_CONNECTOR_MODE
      value: live
    - name: HUNCH_ALPACA_CONNECTOR_RELEASE_UID
      value: ''
    - name: HUNCH_IBKR_CONNECTOR_RELEASE_UID
      value: ''
    # Research sources: `quant` always; add `finnhub` after declaring `access.secrets:
    # [{name: HUNCH_FINNHUB_API_KEY, policy: value_reader}]` on this API and the research and
    # review Jobs and exporting the Secret's value as HUNCH_FINNHUB_API_KEY in the runtime.
    - name: HUNCH_RESEARCH_SOURCES
      value: quant
    # `inference` records every research, review and analysis model call through the platform
    # (ADR 0002); `heuristic` is the deterministic fallback for an Environment without a shared
    # credential that has a recorded-inference adapter.
    - name: HUNCH_RESEARCH_MODE
      value: inference
    # The shared recorded-inference selection every model role starts from (ADR 0007): Meta's
    # Muse Spark 1.3 on the Environment's `meta` credential, shared with this workload under
    # `access.model_providers` above. Meta's thinking levels are minimal to xhigh (no off).
    - name: HUNCH_INFERENCE_PROVIDER
      value: meta
    - name: HUNCH_INFERENCE_MODEL
      value: muse-spark-1.3
    - name: HUNCH_INFERENCE_THINKING
      value: medium
    - name: HUNCH_INFERENCE_CREDENTIAL
      value: meta
    # Model roles (ADR 0007): `research` (builds), `review` (daily reviews) and `analysis` (the
    # analysis-only tools, which run in this API) each select the provider, model, thinking level
    # and credential of their recorded model calls as space-separated key=value pairs over the
    # shared selection above. Recorded inference accepts providers with an adapter: openai,
    # anthropic, openrouter, meta (since backend commit 4f844bdf8), a custom endpoint; not
    # openai-codex. The review and analysis roles run Muse Spark 1.3; the analysis role answers a
    # person synchronously within the platform's 90-second deadline, so it reasons lightly.
    - name: HUNCH_MODEL_ANALYSIS
      value: model=muse-spark-1.3 thinking=low
    # Reviews a person or the Agent starts run in this API too (the scheduled ones run in the
    # review Job). Hosted (HUNCH_BUILD_EXECUTION=job) research runs as the research Job and
    # construction as the build Job, which calls no model (ADR 0008). Same roles as there: the
    # research role runs Muse Wonder 1.0, Meta's most capable model (owner's decision 2026-11-02).
    - name: HUNCH_MODEL_REVIEW
      value: model=muse-spark-1.3 thinking=medium
    - name: HUNCH_MODEL_RESEARCH
      value: model=muse-wonder-1.0 thinking=medium
# The branch's one Harness Agent: the Hunch Agent. It reaches every project tool through the
# `hunch` API's MCP and acts for the person whose request it serves (only an Organization admin's
# push enables this). It reads no tables itself and never calls a venue connector.
- key: hunch-agent
  kind: harness_agent
  acts_for_requester: true
  access:
    resources:
    - key: hunch
      policy: user
  spec:
    source_path: api/agent/main.py
    # The Agent's one conversation model (ADR 0007 decision 2): Meta's Muse Spark 1.3, like the
    # research, review and analysis roles. Meta is outside Tau's own catalog, so the runtime needs
    # ms-tau-sdk >= 2.0.28 (it reads the platform's `catalog_definition` from the hydrated
    # credential) and the person the Agent acts for needs a Meta credential in the Environment.
    # openai-codex / gpt-5.6-luna until 2026-11-01.
    llm_provider: meta
    llm_model: muse-spark-1.3
    llm_thinking: medium
    mcp_applications:
    - resource: hunch
    # Only Hunch application tools; TAU retains skill-scoped reading and A2A Task controls.
    env_vars:
    - name: TAU_EXCLUDE_BASE_TOOLS
      value: 'true'
    - name: TAU_EXCLUDE_MAINSEQUENCE_MCP
      value: 'true'
    cpu_request: 250m
    memory_request: 512Mi
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
    revision_retention_count: 3
- key: hunch-migrate
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Hunch Migrations
    description: Apply the hunch MetaTable schema revisions before the API rolls out.
    execution_path: src/jobs/migrate_hunch.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
# Research, builds, refreshes and reviews run as one shared Job per kind, selected by `--take-uid`
# (the API, the Agent through the API, and the dispatchers start them). A Job cannot hold `runner`
# on itself, so a dispatcher Job owns each schedule: the refresh dispatcher still refreshes in its
# own process; the review dispatcher starts one review Job run per active take
# (HUNCH_REVIEW_DISPATCH=job, ADR 0007), so the reviews run on the review Job's model credential.
#
# Research and portfolio construction are independent steps with their own Jobs (ADR 0008): the
# research Job studies the target universe on the research role's model and stores a numbered
# research; the build Job constructs the basket from a stored research and calls no model, so it
# holds no model credential.
- key: hunch-take-research
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    model_providers:
    # Research runs through recorded inference on the Environment's Meta credential (ADR 0007).
    # Declared on the build Job from 2026-11-01 and moved here with ADR 0008, when research became
    # this Job. Every later push keeps the share and usage is billed to the credential's owner.
    - provider: meta
      custom_id: meta
      policy: user
  spec:
    name: Hunch Take Research
    description: Research one take's thesis against the target universe and keep the result as its next numbered research (--take-uid); decides no weight.
    execution_path: src/jobs/run_hunch_take_research.py
    cpu_request: '0.5'
    memory_request: '1'
    max_runtime_seconds: 1800
    spot: false
    env_vars:
    - name: HUNCH_RESEARCH_MODE
      value: inference
    # The shared recorded-inference selection every model role starts from (ADR 0007): Meta's
    # Muse Spark 1.3 on the Environment's `meta` credential, shared with this workload under
    # `access.model_providers` above. Meta's thinking levels are minimal to xhigh (no off).
    - name: HUNCH_INFERENCE_PROVIDER
      value: meta
    - name: HUNCH_INFERENCE_MODEL
      value: muse-spark-1.3
    - name: HUNCH_INFERENCE_THINKING
      value: medium
    - name: HUNCH_INFERENCE_CREDENTIAL
      value: meta
    # The research role's model (ADR 0007): the whole universe and the evidence in one prompt.
    # Researching the target universe gets the strongest Muse model, Muse Wonder 1.0 (owner's
    # decision 2026-11-02); the shared selection above stays Spark 1.3. Medium thinking keeps the
    # answer inside recorded inference's 60-second transport budget.
    - name: HUNCH_MODEL_RESEARCH
      value: model=muse-wonder-1.0 thinking=medium
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
- key: hunch-take-build
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
  spec:
    name: Hunch Take Build
    description: Construct one take's basket from a stored research (--take-uid, optionally --research-uid), publish it and build its portfolio; calls no model.
    execution_path: src/jobs/run_hunch_take_build.py
    cpu_request: '0.5'
    memory_request: '1'
    max_runtime_seconds: 1800
    spot: false
    env_vars: []
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
- key: hunch-portfolio-refresh
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
  spec:
    name: Hunch Portfolio Refresh
    description: Bring prices up to date and extend the values of one take (--take-uid) or of every built take (--scheduled).
    execution_path: src/jobs/run_hunch_portfolio_refresh.py
    cpu_request: '0.5'
    memory_request: '1'
    max_runtime_seconds: 3600
    spot: false
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
- key: hunch-portfolio-refresh-dispatcher
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    resources:
    - key: hunch-portfolio-refresh
      policy: runner
  spec:
    name: Hunch Portfolio Refresh Dispatcher
    description: Start the scheduled refresh of every built take after the US market close.
    execution_path: src/jobs/run_hunch_portfolio_refresh.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '30 1 * * 2-6'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
- key: hunch-daily-review
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    model_providers:
    # Same share as the build Job (ADR 0007).
    - provider: meta
      custom_id: meta
      policy: user
  spec:
    name: Hunch Daily Review
    description: 'Review one active take (--take-uid) or every active take (--scheduled): drift, thesis check, proposal or autopilot.'
    execution_path: src/jobs/run_hunch_daily_review.py
    cpu_request: '0.5'
    memory_request: '1'
    max_runtime_seconds: 3600
    spot: false
    env_vars:
    - name: HUNCH_RESEARCH_MODE
      value: inference
    # The shared recorded-inference selection every model role starts from (ADR 0007): Meta's
    # Muse Spark 1.3 on the Environment's `meta` credential, shared with this workload under
    # `access.model_providers` above. Meta's thinking levels are minimal to xhigh (no off).
    - name: HUNCH_INFERENCE_PROVIDER
      value: meta
    - name: HUNCH_INFERENCE_MODEL
      value: muse-spark-1.3
    - name: HUNCH_INFERENCE_THINKING
      value: medium
    - name: HUNCH_INFERENCE_CREDENTIAL
      value: meta
    # The review role's model (ADR 0007): one thesis check per active take per session day.
    - name: HUNCH_MODEL_REVIEW
      value: model=muse-spark-1.3 thinking=medium
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
- key: hunch-daily-review-dispatcher
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    resources:
    - key: hunch-daily-review
      policy: runner
  spec:
    name: Hunch Daily Review Dispatcher
    description: Start one review Job run per active take before the US open on session days and follow them to the end.
    execution_path: src/jobs/run_hunch_daily_review.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    env_vars:
    # `job`: start one `Hunch Daily Review` run per active take, three at a time, and follow each
    # batch to its end, so every thesis check runs on the review Job's Meta credential and this
    # workload needs no model-provider share of its own (ADR 0007). `inline` would review every
    # take in this process on the deterministic check below.
    - name: HUNCH_REVIEW_DISPATCH
      value: job
    - name: HUNCH_RESEARCH_MODE
      value: heuristic
    task_schedule:
      schedule:
        type: crontab
        expression: '0 13 * * 1-5'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
- key: hunch-execution-sync
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
  spec:
    name: Hunch Execution Sync
    description: Pull order states from the venue connectors, book fills into the takes' funds and expire stale proposals.
    execution_path: src/jobs/run_hunch_execution_sync.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '*/15 13-21 * * 1-5'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
- key: hunch-leaderboard
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
  spec:
    name: Hunch Leaderboard
    description: Snapshot the ranking of published takes after the refresh.
    execution_path: src/jobs/run_hunch_leaderboard.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '30 2 * * 2-6'
        timezone: UTC
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
- key: hunch-email-digest
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
  spec:
    name: Hunch Email Digest
    description: 'Email every opted-in person a digest of their undelivered notifications and pending proposals (--scheduled), after the daily reviews.'
    execution_path: src/jobs/run_hunch_email_digest.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    env_vars:
    # `platform` delivers through a Main Sequence Notification with include_email; `outbox` and
    # `smtp` are the local and self-hosted alternatives (see hunch/channels/email.py).
    - name: HUNCH_EMAIL_SENDER
      value: platform
    - name: HUNCH_SITE_URL
      value: ''
    task_schedule:
      schedule:
        type: crontab
        expression: '30 13 * * 1-5'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: 'v\d+\.\d+\.\d+'
# The migration Job runs from the API's candidate image. The API deploys only after it succeeds,
# and the Agent deploys from its own image only after the API whose MCP it uses.
execution:
  steps:
    image:
      prepare_image: hunch
    migrate:
      run_job: hunch-migrate
      image_from: image
      needs: [image]
    deploy_api:
      deploy: hunch
      image_from: image
      needs: [migrate]
    agent_image:
      prepare_image: hunch-agent
    deploy_agent:
      deploy: hunch-agent
      image_from: agent_image
      needs: [deploy_api, agent_image]
