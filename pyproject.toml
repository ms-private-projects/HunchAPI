[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunchapi"
version = "0.1.0"
description = "Hunch: theses turned into managed portfolios on Main Sequence, ms-markets and the Alpaca and IBKR connectors."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  # Keep compatible ranges here and let uv.lock capture the reproducible environment.
  "fastapi>=0.135.3",
  "uvicorn>=0.52.4,<0.53",
  # Main Sequence SDK 9 with the MCP extra: request identity, `install_mcp`, skills publishing.
  "mainsequence[mcp]>=9.0.30,<10",
  # The MetaTables client (`metatables`): migrations provider and governed table access.
  "mainsequence-metatable>=0.1.57,<0.2",
  # Every market primitive comes from ms-markets. 3.x carries the ADR 0048 names (`time_index`,
  # `*Updater`); the rename scan in the validation keeps the code on the 3.0 names (ADR 0005).
  "ms-markets[portfolios]>=3.0.1,<4",
  # Hunch reads exchange sessions itself (`hunch.market_data`), so it declares the calendars too.
  "pandas-market-calendars>=5.4.0",
  # Runtime of the Hunch Agent (`api/agent/main.py`); the platform runs it from this image.
  "ms-tau-sdk>=2.0.23,<3",
  "jsonschema>=4.23",
  "pydantic>=2.9",
]

[tool.setuptools.packages.find]
# Ship exactly one top-level import package. `src/jobs/` launchers and the `api/` deployment
# entry points are executed from the checkout by path and are not part of the wheel.
where = ["src"]
include = ["hunch*"]

[tool.setuptools.package-data]
"hunch.migrations" = ["script.py.mako"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.5",
  "pyyaml>=6.0",
  "httpx>=0.28.1",
  "pyjwt>=2.10",
  "cryptography>=44",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["build", "dist", ".venv", ".tox", ".mypy_cache", ".ruff_cache"]
src = ["src", "api", "tests"]
fix = true

[tool.ruff.lint]
select = ["I"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["mainsequence", "metatables", "msm", "msm_portfolios", "hunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
